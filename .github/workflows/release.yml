name: Release

on:
  push:
    tags: ["v*"]
  # Manual escape hatch: dispatch against an existing tag ref (Actions UI's
  # branch/tag picker, or `gh workflow run release.yml --ref vX.Y.Z`) when the
  # tag push itself didn't trigger this workflow (missed webhook delivery).
  workflow_dispatch: {}

permissions:
  contents: write # create releases + upload assets

jobs:
  # CLI + edge binaries, archives, checksums, Homebrew tap, deb/rpm.
  cli:
    if: ${{ !startsWith(github.ref_name, 'package-v') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write # create releases + upload assets
      id-token: write # cosign keyless signing (Sigstore OIDC) — see .goreleaser.yaml signs:
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-go@v5
        with: { go-version: "1.26" }
      - uses: sigstore/cosign-installer@v3
      - uses: goreleaser/goreleaser-action@v6
        with:
          version: "~> 2"
          args: release --clean
        env:
          # Cross-repo release: .goreleaser.yaml publishes to uzcreator/trqshcli,
          # not this (uzcreator/trqsh) repo, so the workflow's own GITHUB_TOKEN
          # (scoped only to the repo it runs in) can't create the release or
          # upload assets there. RELEASE_REPO_TOKEN is a classic PAT with repo
          # scope on trqshcli — set it in this repo's Settings > Secrets >
          # Actions. Until it's set, this step fails with a 404/403 creating
          # the release (everything else in this workflow is unaffected).
          GITHUB_TOKEN: ${{ secrets.RELEASE_REPO_TOKEN }}
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}

  # Dispatch this workflow on package-vX.Y.Z to release only CLI dependencies
  # plus npm/PyPI. The prefix does not trigger the v* image/desktop pipelines.
  cli_packages:
    name: CLI package binaries
    if: startsWith(github.ref_name, 'package-v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: "1.26" }
      - uses: sigstore/cosign-installer@v3
      - name: Check release repository access
        run: gh api repos/trqsh-tunnel/trqshcli --jq '.permissions.push' | grep -qx true
        env:
          GH_TOKEN: ${{ secrets.RELEASE_REPO_TOKEN }}
      - name: Test transports and CLI
        run: go test ./pkg/tunnel ./internal/agent/... ./internal/server/... -race -count=1
      - name: Build CLI archives
        run: bash packaging/release-cli.sh
      - name: Sign checksums
        run: cosign sign-blob --yes --new-bundle-format --bundle dist/checksums.txt.sigstore.json dist/checksums.txt
      - name: Publish CLI download dependencies
        run: |
          version="${GITHUB_REF_NAME#package-v}"
          gh release create "v${version}" --repo trqsh-tunnel/trqshcli --target main \
            --title "trqsh CLI v${version}" --notes-file "packaging/RELEASE-NOTES-${version}.md" dist/*
        env:
          GH_TOKEN: ${{ secrets.RELEASE_REPO_TOKEN }}

  # Publish the npm wrapper (npx trqsh / npm i -g trqsh). Runs after the release
  # exists so the binary + checksums are downloadable. Skips cleanly if NPM_TOKEN
  # isn't configured, so it never blocks a binary release.
  npm:
    needs: [cli, cli_packages]
    if: ${{ always() && !cancelled() && (needs.cli.result == 'success' || needs.cli_packages.result == 'success') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - name: Publish to npm
        working-directory: packaging/npm
        run: |
          if [ -z "${NODE_AUTH_TOKEN}" ]; then
            echo "NPM_TOKEN secret not set — skipping npm publish."; exit 0
          fi
          VER="${GITHUB_REF_NAME#package-}"
          VER="${VER#v}"
          node --test test/install.test.js
          npm version "$VER" --no-git-tag-version --allow-same-version
          npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  # Publish the PyPI wrapper (pip install trqsh). Skips cleanly if PYPI_TOKEN
  # isn't configured.
  pypi:
    needs: [cli, cli_packages]
    if: ${{ always() && !cancelled() && (needs.cli.result == 'success' || needs.cli_packages.result == 'success') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Build & publish to PyPI
        working-directory: packaging/pypi
        run: |
          if [ -z "${TWINE_PASSWORD}" ]; then
            echo "PYPI_TOKEN secret not set — skipping PyPI publish."; exit 0
          fi
          VER="${GITHUB_REF_NAME#package-}"
          VER="${VER#v}"
          python -m unittest test_runtime.py
          python -m pip install --upgrade build twine
          sed -i -E "s/^version = \".*\"/version = \"$VER\"/" pyproject.toml
          sed -i -E "s/^__version__ = \".*\"/__version__ = \"$VER\"/" src/trqsh/__init__.py
          python -m build
          python -m twine upload dist/*
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_TOKEN }}
