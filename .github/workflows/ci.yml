name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  GO_VERSION: "1.26"

jobs:
  go:
    name: Go build, test, lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: Build
        run: go build ./...
      - name: Check embedded OpenAPI is current
        run: |
          cp docs/openapi.yaml internal/api/openapi.yaml
          git diff --exit-code internal/api/openapi.yaml \
            || (echo "::error::internal/api/openapi.yaml is stale — run 'make openapi-sync'"; exit 1)
      - name: Test (race)
        run: go test ./... -race -count=1
      - name: Vet
        run: go vet ./...
      - name: golangci-lint
        # Built from source (not golangci-lint-action's prebuilt release) so it
        # always compiles with the same toolchain setup-go just installed.
        # golangci-lint's releases lag behind fresh Go versions — "latest"
        # pinned to a go1.24 build has repeatedly rejected this repo's
        # go1.25+ go.mod (a known, recurring upstream issue, not specific to
        # any one Go release: golangci/golangci-lint#5873, #6127, #6272).
        run: |
          go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@latest
          golangci-lint run ./...

  frontends:
    name: Frontend builds
    runs-on: ubuntu-latest
    strategy:
      matrix:
        app: [web/dashboard, web/site, desktop]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: ${{ matrix.app }}/pnpm-lock.yaml
      - name: Install
        working-directory: ${{ matrix.app }}
        run: pnpm install --frozen-lockfile
      # Check this revision's contract, not an older deployed API. Otherwise
      # correcting API docs would require deploying a branch before CI can pass.
      - name: Check website OpenAPI matches the source contract
        if: matrix.app == 'web/site'
        run: |
          cmp docs/openapi.yaml web/site/lib/openapi.generated.yaml \
            || (echo "::error::Website OpenAPI is stale — sync it from docs/openapi.yaml"; exit 1)
      # Pricing still regenerates from the configured public catalog. An API
      # outage skips only that remote check; contract validation above is local.
      - name: Check generated plan catalog is current
        if: matrix.app == 'web/site'
        working-directory: web/site
        run: |
          api="${TRQSH_API_URL:-https://api.trqsh.uz}"
          if ! curl -fsS --retry 2 --retry-all-errors --max-time 20 -o /dev/null "$api/v1/plans/public"; then
            echo "::warning::Control API $api unreachable — skipping plan-catalog drift check."
            exit 0
          fi
          node scripts/genplans.mjs
          git diff --exit-code lib/catalog.generated.ts \
            || (echo "::error::web/site's plan catalog is stale — run 'make site-plans'"; exit 1)
      - name: Build
        working-directory: ${{ matrix.app }}
        run: pnpm build
      # Canonicals, sitemap, robots, JSON-LD and docs navigation, checked against
      # the real modules. `pnpm check:seo` checks a running server's HTML.
      - name: SEO tests
        if: matrix.app == 'web/site'
        working-directory: web/site
        run: pnpm test
      - name: Dashboard tests
        if: matrix.app == 'web/dashboard'
        working-directory: web/dashboard
        run: pnpm test

  helm:
    name: Helm lint + template
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
        with:
          version: v3.16.3
      - name: Lint
        run: helm lint deploy/helm/trqsh -f deploy/helm/trqsh/values.staging.yaml
      - name: Template (render must succeed)
        run: |
          helm template trqsh deploy/helm/trqsh \
            -f deploy/helm/trqsh/values.staging.yaml \
            --set secrets.existingSecret=trqsh-secrets > /dev/null

  terraform:
    name: Terraform fmt + validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
      - name: Format check
        run: terraform -chdir=deploy/terraform fmt -check -recursive
      - name: Validate
        run: |
          terraform -chdir=deploy/terraform init -backend=false
          terraform -chdir=deploy/terraform validate

  compose:
    name: Compose config
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate compose
        run: |
          docker compose -f deploy/docker-compose.dev.yml config --quiet
          docker compose -f deploy/docker-compose.single.yml config --quiet
