[unix_http_server]
file=/run/trqsh/supervisor.sock
chmod=0700

[supervisord]
nodaemon=true
user=app
logfile=/dev/null
pidfile=/run/trqsh/supervisord.pid

[rpcinterface:supervisor]
supervisor.rpcinterface_factory=supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///run/trqsh/supervisor.sock

[program:postgres]
command=/usr/local/bin/docker-entrypoint.sh postgres -c listen_addresses=127.0.0.1 -c max_connections=60 -c shared_buffers=64MB
priority=10
autorestart=true
stopasgroup=true
killasgroup=true
stopwaitsecs=45
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:redis]
command=/usr/bin/redis-server --bind 127.0.0.1 --protected-mode yes --appendonly yes --dir /data/redis
priority=10
autorestart=true
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:api]
command=/usr/local/bin/trqsh-single-service api
environment=TRQSH_METRICS_ADDR="127.0.0.1:9091"
priority=20
startsecs=5
autorestart=true
stopasgroup=true
killasgroup=true
stopwaitsecs=30
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:dashboard]
command=/usr/local/bin/node /app/dashboard/server.js
directory=/app/dashboard
environment=PORT="3001",HOSTNAME="0.0.0.0",HOME="/app"
priority=30
autorestart=true
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:site]
command=/usr/local/bin/node /app/site/server.js
directory=/app/site
environment=PORT="3000",HOSTNAME="0.0.0.0",HOME="/app"
priority=30
autorestart=true
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:edge]
command=/usr/local/bin/trqsh-single-service edge
environment=TRQSH_METRICS_ADDR="127.0.0.1:9090"
priority=40
startsecs=5
autorestart=true
stopasgroup=true
killasgroup=true
stopwaitsecs=35
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
